# Place this exact location in the zhangzhh13.xyz TLS server block.
# The forward-auth snippet rejects anonymous requests and sets identity variables.
location = /__homepage_account {
    include /etc/nginx/snippets/authentik-forward-auth.conf;
    proxy_pass http://127.0.0.1:3000/api/healthcheck;
    proxy_set_header Host $host;
    add_header X-Homepage-User-Username $authentik_username always;
    add_header X-Homepage-User-Name $authentik_name always;
    add_header X-Homepage-User-Email $authentik_email always;
    add_header Cache-Control "no-store" always;
}
