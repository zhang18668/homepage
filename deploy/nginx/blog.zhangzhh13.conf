# Stock Blog lives on its own hostname and is protected by the existing
# Authentik domain-level Forward Auth provider.
server {
    listen 80;
    listen [::]:80;
    server_name blog.zhangzhh13.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blog.zhangzhh13.xyz;

    ssl_certificate /etc/letsencrypt/live/blog.zhangzhh13.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.zhangzhh13.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /outpost.goauthentik.io {
        proxy_pass http://127.0.0.1:9000/outpost.goauthentik.io;
        proxy_set_header Host $ak_http_host;
        proxy_set_header X-Forwarded-Host $ak_http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URL $scheme://$ak_http_host$request_uri;
        proxy_set_header X-Original-URI "";
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie always;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location @goauthentik_proxy_signin {
        internal;
        add_header Set-Cookie $auth_cookie always;
        return 302 https://auth.zhangzhh13.xyz/outpost.goauthentik.io/start?rd=$scheme://$ak_http_host$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:32002/;
        include /etc/nginx/snippets/authentik-forward-auth.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 300s;
    }
}
